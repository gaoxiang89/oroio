name: Build Electron

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'web/**'
      - '.github/workflows/build-electron.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Smoke test dk.ps1 (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          USERPROFILE: '${{ runner.temp }}\oroio-test'
          LOCALAPPDATA: '${{ runner.temp }}\oroio-test\AppData\Local'
        run: |
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          ./bin/dk.ps1 add "sk-ci-1"
          ./bin/dk.ps1 add "sk-ci-2"
          ./bin/dk.ps1 use 2
          # dk run inherits OS handles, so the script success stream is not the
          # child stdout. Have the child write the key to a file instead.
          $marker = Join-Path $env:RUNNER_TEMP 'factory-key.txt'
          $errFile = Join-Path $env:RUNNER_TEMP 'dk-run-err.txt'
          Remove-Item $marker, $errFile -ErrorAction SilentlyContinue
          $cmd = "Set-Content -LiteralPath '$marker' -Encoding ascii -Value `$env:FACTORY_API_KEY -NoNewline"
          $proc = Start-Process -FilePath pwsh.exe -ArgumentList @(
            '-NoLogo', '-NoProfile', '-NonInteractive',
            '-File', (Resolve-Path './bin/dk.ps1').Path,
            'run', 'pwsh.exe', '-NoLogo', '-NoProfile', '-Command', $cmd
          ) -Wait -PassThru -RedirectStandardError $errFile
          $out = if (Test-Path -LiteralPath $marker) { Get-Content -LiteralPath $marker -Raw } else { '' }
          $err = if (Test-Path -LiteralPath $errFile) { Get-Content -LiteralPath $errFile -Raw } else { '' }
          if ($proc.ExitCode -ne 0 -or $out -ne 'sk-ci-2') {
            throw "dk run failed exit=$($proc.ExitCode) marker=[$out] stderr=[$err]"
          }

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Install electron dependencies
        working-directory: electron
        run: npm ci

      - name: Build electron main
        working-directory: electron
        run: npm run build:main

      - name: Build electron app
        working-directory: electron
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}
          path: |
            electron/release/*.dmg
            electron/release/*.exe
            electron/release/*.AppImage
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .git
          sparse-checkout-cone-mode: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f 2>/dev/null || ls -la artifacts/ || echo "No artifacts"

      - name: Update tag
        run: |
          git tag -f electron-dist
          git push -f origin electron-dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: electron-dist
          name: Electron Desktop App
          body: |
            Pre-built desktop application for macOS, Windows, and Linux.
            
            **macOS**: Download `.dmg`
            > After installing, run `xattr -cr /Applications/oroio.app` to bypass Gatekeeper (app is unsigned).
            
            **Windows**: Download `.exe` installer
            
            **Linux**: Download `.AppImage`
          files: artifacts/*
          fail_on_unmatched_files: false
